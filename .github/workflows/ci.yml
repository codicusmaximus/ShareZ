name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb openbox xterm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: X11 capture and window list on a real X server
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash -euo pipefail -c '
            openbox & sleep 1
            xterm & sleep 1
            SHAREZ_X11_TESTS=1 cargo test -p sharez-capture --locked --test x11
            XDG_SESSION_TYPE=x11 cargo run -q --locked -- --list-windows | tee windows.json
            grep -q "\"app_id\": \"XTerm\"" windows.json
          '

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
