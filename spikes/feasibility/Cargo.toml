[package]
name = "sharez-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Throwaway feasibility probes for ShareZ capture backends"

[workspace]

[dependencies]
anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot", "screencast"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
x11rb = { version = "0.14", features = ["randr"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
