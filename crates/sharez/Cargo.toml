[package]
name = "sharez"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }
png = { version = "0.18.1", default-features = false }
serde_json = "1.0.154"
sharez-capture = { version = "0.1.1", path = "../sharez-capture" }
sharez-core = { version = "0.1.1", path = "../sharez-core" }
sharez-record = { version = "0.1.1", path = "../sharez-record" }
sharez-windows = { version = "0.1.1", path = "../sharez-windows" }
x11rb = "0.14"

[lints]
workspace = true
